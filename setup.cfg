[metadata]
name = ai-security-lab-dashboard
version = 0.1.0
description = Local control plane for the AI Security Lab project portfolio
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = MintKangaroo
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Topic :: Security

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
lab_dashboard =
    config/*.json
    static/*

[options.entry_points]
console_scripts =
    lab-dashboard = lab_dashboard.server:main

[options.extras_require]
dev =
    pytest>=8.0
    ruff>=0.5
